[package]
name = "rawter"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", features = ["svg"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"